spring.application.name=hoadon

# Cho phép local nạp biến từ .env (tệp này đã được .gitignore). Trên production,
# systemd tiếp tục nạp /etc/hoadon/hoadon.env như hiện tại.
spring.config.import=optional:file:.env[.properties]

# UTF8
spring.mandatory-file-encoding=UTF-8
spring.mail.default-encoding=UTF-8

# Cổng backend, dùng 8081 để tránh trùng với frontend dev server trên 8080
server.port=${SERVER_PORT:8081}

# Nginx production kết nối backend qua loopback. Tomcat chỉ áp dụng forwarded
# headers từ proxy nội bộ để nhận đúng scheme/host/client IP phía ngoài.
server.forward-headers-strategy=native

# URL mặc định cho môi trường local. Production ghi đè bằng APP_FRONTEND_URL
# và APP_BACKEND_URL trong /etc/hoadon/hoadon.env.
app.frontend-url=${APP_FRONTEND_URL:http://hoadon2er.local.vn}
app.backend-url=${APP_BACKEND_URL:http://hoadon2er.local.vn}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://hoadon2er.local.vn,http://hoadon2er.local.vn:8081,http://localhost,http://localhost:8080,http://127.0.0.1,http://127.0.0.1:8080}

# MoMo sandbox demo. Có thể override bằng biến môi trường MOMO_* khi dùng tài khoản M4B riêng.
momo.enabled=true
momo.endpoint=https://test-payment.momo.vn
momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.redirect-url=${MOMO_REDIRECT_URL:}
momo.ipn-url=${MOMO_IPN_URL:}
momo.lang=vi

# VNPAY sandbox test. Có thể override bằng biến môi trường VNPAY_* khi đổi merchant.
vnpay.enabled=true
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.locale=vn
vnpay.order-type=other
vnpay.expire-minutes=15

# ZaloPay sandbox test. Có thể override bằng biến môi trường ZALOPAY_* khi đổi merchant.
zalopay.enabled=true
zalopay.app-id=${ZALOPAY_APP_ID:2553}
zalopay.key1=${ZALOPAY_KEY1:}
zalopay.key2=${ZALOPAY_KEY2:}
zalopay.create-order-url=${ZALOPAY_CREATE_ORDER_URL:https://sb-openapi.zalopay.vn/v2/create}
zalopay.query-order-url=${ZALOPAY_QUERY_ORDER_URL:https://sb-openapi.zalopay.vn/v2/query}
zalopay.bank-list-url=${ZALOPAY_BANK_LIST_URL:https://sbgateway.zalopay.vn/api/getlistmerchantbanks}
zalopay.bank-list-app-id=${ZALOPAY_BANK_LIST_APP_ID:2553}
zalopay.bank-list-key1=${ZALOPAY_BANK_LIST_KEY1:}
zalopay.redirect-url=${ZALOPAY_REDIRECT_URL:}
zalopay.callback-url=${ZALOPAY_CALLBACK_URL:}
zalopay.app-user=${ZALOPAY_APP_USER:hoadon}
zalopay.bank-code=${ZALOPAY_BANK_CODE:}
zalopay.preferred-payment-methods=${ZALOPAY_PREFERRED_PAYMENT_METHODS:zalopay_wallet}

# Bật cơ chế bảo mật của Spring
spring.security.enabled=true

# SQL Server local; production phải ghi đè toàn bộ thông tin kết nối qua environment.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=hoadon_database;encrypt=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.globally_quoted_identifiers=true

jwt.secret=${JWT_SECRET}
jwt.expiration_ms=86400000

# Ghi log ra file và đặt package hệ thống ở mức DEBUG để lưu log AuthController
logging.file.name=${LOGGING_FILE_NAME:logs/hoadon.log}
logging.level.vn.hoadon=${LOGGING_LEVEL_VN_HOADON:INFO}

# PATVAN UAT transmission. Giữ mặc định UAT; không dùng endpoint PROD cho luồng gửi CQT hiện tại.
patvan.uat.oauth-url=${PATVAN_UAT_OAUTH_URL:https://ote-tvan.hoadon30s.vn/token}
patvan.uat.oauth-mtt-url=${PATVAN_UAT_OAUTH_MTT_URL:https://ote-tvan-mtt.hoadon30s.vn/token}
patvan.uat.oauth-ct-url=${PATVAN_UAT_OAUTH_CT_URL:https://ote-tvan-chungtu.hoadon30s.vn/token}
patvan.uat.client-id=${PATVAN_UAT_CLIENT_ID:}
patvan.uat.client-secret=${PATVAN_UAT_CLIENT_SECRET:}
patvan.uat.client-mtt-id=${PATVAN_UAT_CLIENT_MTT_ID:}
patvan.uat.client-mtt-secret=${PATVAN_UAT_CLIENT_MTT_SECRET:}
patvan.uat.client-ct-id=${PATVAN_UAT_CLIENT_CT_ID:}
patvan.uat.client-ct-secret=${PATVAN_UAT_CLIENT_CT_SECRET:}
patvan.uat.ssl-verify=${PATVAN_UAT_SSL_VERIFY:false}
patvan.uat.server-cert-sha256=${PATVAN_UAT_SERVER_CERT_SHA256:8C2EBE5EA8DBCC68510D9E9A92FD6AE699F33563149785E1B6BBB9CFE0E2E6DA}
patvan.uat.hd-url=${PATVAN_UAT_HD_URL:https://ote-tvan.hoadon30s.vn/hoa-don-co-ma}
patvan.uat.hdkm-url=${PATVAN_UAT_HDKM_URL:https://ote-tvan.hoadon30s.vn/hoa-don-khong-ma}
patvan.uat.hdmtt-url=${PATVAN_UAT_HDMTT_URL:https://ote-tvan-mtt.hoadon30s.vn/hoa-don-may-tinh-tien}
patvan.uat.cttncn-url=${PATVAN_UAT_CTTNCN_URL:https://ote-tvan-chungtu.hoadon30s.vn/chung-tu-khau-tru-thue}
patvan.uat.dksd-url=${PATVAN_UAT_DKSD_URL:https://ote-tvan.hoadon30s.vn/dang-ky-to-khai}
patvan.uat.dksdctdt-url=${PATVAN_UAT_DKSDCTDT_URL:https://ote-tvan-chungtu.hoadon30s.vn/to-khai-chung-tu-dien-tu}
patvan.uat.tbss-url=${PATVAN_UAT_TBSS_URL:https://ote-tvan.hoadon30s.vn/thong-bao-sai-sot}
patvan.uat.tbss-mtt-url=${PATVAN_UAT_TBSS_MTT_URL:https://ote-tvan-mtt.hoadon30s.vn/thong-bao-sai-sot-may-tinh-tien}
patvan.uat.tbss-ct-url=${PATVAN_UAT_TBSS_CT_URL:https://ote-tvan-chungtu.hoadon30s.vn/chung-tu-sai-sot}
patvan.uat.bthhd-url=${PATVAN_UAT_BTHHD_URL:https://ote-tvan.hoadon30s.vn/bang-tong-hop}

# Callback thật luôn được nhận tại /v1/api/patvan/callback.
# AppEnvironment nhận diện tập trung qua app.backend-url; production dùng APP_BACKEND_URL=https://hoadon2er.id.vn.
patvan.callback.provider-tax-code=${PATVAN_CALLBACK_PROVIDER_TAX_CODE:0302431595}

# Cấu hình mail dự phòng. SMTP chính được lưu trong bảng mail_servers.
# Để trống username/password tại đây; cấu hình SMTP trong giao diện ứng dụng.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Khóa AES-256 để mã hóa mật khẩu SMTP lưu trong DB. Nên thay bằng chuỗi bí mật dài từ 32 ký tự.
app.encryption.key=${APP_ENCRYPTION_KEY}

# Hàng đợi mail bằng database
# Tác vụ gửi email được lưu trong bảng mail_jobs của SQL Server và xử lý bởi DbMailQueueWorker.
mail.queue.max-retries=3
