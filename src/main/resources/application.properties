spring.application.name=hoadon

# UTF8
spring.mandatory-file-encoding=UTF-8
spring.mail.default-encoding=UTF-8

# Cổng backend, dùng 8081 để tránh trùng với frontend dev server trên 8080
server.port=8081

# URL frontend dùng trong các liên kết gửi qua email
app.frontend-url=http://localhost:8080
app.backend-url=http://localhost:8081

