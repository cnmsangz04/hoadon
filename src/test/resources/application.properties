spring.datasource.url=jdbc:h2:mem:hoadon_test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=test-jwt-secret-at-least-32-bytes-long
app.encryption.key=test-encryption-key-at-least-32-bytes
app.frontend-url=http://example.test
app.backend-url=http://example.test
app.cors.allowed-origins=http://example.test
